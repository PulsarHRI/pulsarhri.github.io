site_name: PULSAR HRI Developer Hub
site_description: Hardware, software, control, and simulation documentation for PULSAR HRI PULSE actuators.
site_url: https://pulsarhri.github.io/
use_directory_urls: true

repo_url: https://github.com/PulsarHRI/pulsarhri.github.io
repo_name: PulsarHRI/pulsarhri.github.io

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
      primary: black
      accent: deep orange
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
      primary: grey
      accent: deep orange
  font:
    text: Montserrat medium
    code: Red Hat Mono
  logo: assets/icons/P_Logo_white_svg.png
  favicon: assets/icons/icon.ico
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - redirects:
      redirect_maps:
        quickstarts/quickstart_set_up_usb.md: hardware/actuator_setup.md
        quickstarts/quickstart_pulsar_app.md: quickstart/pulsar_app.md
        quickstarts/quickstart_python_api.md: quickstart/sdk_usb.md
        quickstarts/quickstart_virtual_python_api.md: quickstart/sdk_virtual.md
        set_up/set_up_real.md: hardware/actuator_setup.md
        set_up/set_up_virtual.md: sdk/virtual_actuators.md
        set_up/hardware_interfaces/mechanical_interfaces.md: hardware/mechanical_interfaces.md
        set_up/hardware_interfaces/electrical_interfaces.md: hardware/electrical_interfaces.md
        set_up/hardware_interfaces/led.md: hardware/led.md
        communicate/communicate_real/index.md: hardware/connectivity/index.md
        communicate/communicate_real/usb.md: hardware/connectivity/usb.md
        communicate/communicate_real/can/index.md: hardware/connectivity/can.md
        communicate/communicate_real/can/bus_utilization.md: hardware/connectivity/can_bus_utilization.md
        communicate/communicate_real/ethercat.md: hardware/connectivity/ethercat.md
        communicate/communicate_virtual.md: sdk/virtual_actuators.md
        control/pulsar_app/pulsar_app.md: pulsar_app/index.md
        control/python_api/install_python_api.md: sdk/install.md
        control/python_api/cli.md: sdk/cli.md
        control/python_api/examples.md: sdk/examples.md
        control/python_api/class_PcpOverUsb.md: sdk/api_reference.md
        control/python_api/class_PulsarActuatorReal.md: sdk/api_reference.md
        control/python_api/class_PulsarActuatorVirtual.md: sdk/api_reference.md
        control/python_api/compatibility_aliases.md: sdk/api_reference.md
        control/control_modes_explained/control_modes_overview.md: control_architectures/index.md
        control/control_modes_explained/control_modes_parameters.md: control_architectures/parameters.md
        download/download_app.md: resources/pulsar_app.md
        download/download_3d_models.md: resources/cad.md
        download/download_robot_assets.md: resources/robot_assets.md
        download/download_technical_reports.md: resources/datasheets.md
        download/download_dtwin.md: sdk/install.md
        faq.md: faq_issues.md

exclude_docs: |
  quickstarts/
  set_up/
  communicate/
  control/
  download/download_3d_models.md
  download/download_app.md
  download/download_cpp_api.md
  download/download_dtwin.md
  download/download_robot_assets.md
  download/download_technical_reports.md
  download/dtwin_assets_manifest.json
  download/robot_assets_manifest.json
  download/dtwin_assets/
  download/robot_assets/
  download/pcp-api-cpp-*
  faq.md

markdown_extensions:
  - tables
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/external-links.js
  - assets/javascripts/bus-utilization.js
  - assets/javascripts/docs-version-label.js

extra_css:
  - assets/stylesheets/pulsar.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PulsarHRI

nav:
  - Home: index.md
  - Quickstarts:
      - quickstart/index.md
      - One physical actuator · direct USB · Pulsar App (browser): quickstart/pulsar_app.md
      - One physical actuator · direct USB · Python SDK: quickstart/sdk_usb.md
      - Multiple physical actuators · CAN FD · Python SDK: quickstart/sdk_can.md
      - Virtual actuators · Python SDK: quickstart/sdk_virtual.md
  - Hardware:
      - hardware/index.md
      - Safety and prerequisites: hardware/safety.md
      - Actuator setup: hardware/actuator_setup.md
      - Mechanical interfaces: hardware/mechanical_interfaces.md
      - Electrical interfaces: hardware/electrical_interfaces.md
      - Regenerative energy management: hardware/regenerative_energy_management.md
      - LED status indicators: hardware/led.md
      - Connectivity:
          - hardware/connectivity/index.md
          - USB: hardware/connectivity/usb.md
          - CAN FD: hardware/connectivity/can.md
          - CAN bus utilization: hardware/connectivity/can_bus_utilization.md
          - EtherCAT status: hardware/connectivity/ethercat.md
  - Firmware:
      - firmware/index.md
  - Control:
      - control_architectures/index.md
      - Control parameters by mode: control_architectures/parameters.md
  - Pulsar App:
      - pulsar_app/index.md
      - Browser app: pulsar_app/browser.md
      - PULSAR Desktop App: pulsar_app/desktop.md
      - Pulsar App quickstart: pulsar_app/quickstart.md
  - Pulsar Python SDK:
      - sdk/index.md
      - Install: sdk/install.md
      - Core workflow: sdk/core_workflow.md
      - Physical actuators:
          - sdk/physical/index.md
          - Direct USB: sdk/physical/usb.md
          - CAN: sdk/physical/can.md
      - Virtual actuators: sdk/virtual_actuators.md
      - Groups and platforms: sdk/groups_platforms.md
      - Commands and parameters: sdk/commands_parameters.md
      - Telemetry and callbacks: sdk/telemetry_callbacks.md
      - Lifecycle and recovery: sdk/lifecycle_recovery.md
      - CLI: sdk/cli.md
      - Examples: sdk/examples.md
      - User contract: sdk/user_contract.md
      - API reference: sdk/api_reference.md
  - Pulsar Rust SDK:
      - pulsar_rust_sdk/index.md
  - AUGUR Digital Twin:
      - augur/index.md
      - Co-simulation coupling: augur/co_sim_coupling.md
      - Robot modelling: augur/robot_modelling.md
  - Downloads and Resources:
      - resources/index.md
      - PULSAR Desktop App package: resources/pulsar_app.md
      - Mechanical CAD and printable fixtures: resources/cad.md
      - Robot model assets: resources/robot_assets.md
      - Datasheets: resources/datasheets.md
  - FAQ and Issues: faq_issues.md
  - Support: support.md

